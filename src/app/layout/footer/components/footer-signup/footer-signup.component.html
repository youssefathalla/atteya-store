<form class="elements-start-col gap-4 w-full" novalidate (submit)="onSubmit($event)">
  <div class="elements-start-col gap-2">
    <h2 class="footer-heading">Stay in the Loop</h2>
    <p class="font-body-md opacity-80">Be the first to hear about new arrivals and offers.</p>
  </div>

  <div class="elements-start-col sm:flex-row sm:items-start sm:justify-start gap-3 w-full max-w-xl">
    <app-text-input
      class="w-full sm:flex-1 min-w-0"
      [formField]="signupForm.email"
      label="Email"
      type="email"
      inputMode="email"
      icon="mail"
      placeholder="you@email.com"
    />
    <button
      matButton="filled"
      type="submit"
      class="btn-block-phone sm:mt-2"
      [disabled]="isSending()"
      [attr.aria-label]="isSending() ? 'Subscribing...' : null"
    >
      @if (isSending()) {
        <mat-progress-spinner mode="indeterminate" diameter="18" />
      } @else {
        <span>Subscribe</span>
      }
    </button>
  </div>

  <p class="font-body-sm opacity-80 max-w-xl">
    By subscribing, you agree to our <a class="underline" routerLink="/privacy">Privacy Policy</a>. You can
    unsubscribe at any time.
  </p>

  <p
    class="font-body-sm min-h-5"
    role="status"
    aria-live="polite"
    [class.text-error]="feedback()?.tone === 'error'"
  >
    {{ feedback()?.text }}
  </p>
</form>
