<header class="w-full bg-surface-container-lowest">
  <div class="relative z-20 md:px-8 px-4 w-full h-14 elements-between">
    <!-- Brand Logo -->
    <app-logo />

    <!-- Desktop Primary Navigation (Hover for Mega Menu) -->
    @if (showNavSkeleton()) {
      <div class="hidden lg:flex h-full items-center gap-6 px-4" aria-hidden="true">
        @for (placeholder of [1, 2, 3, 4, 5]; track placeholder) {
          <app-skeleton width="4.5rem" height="0.75rem" />
        }
      </div>
    } @else {
      <app-nav-links [categories]="categories()" />
    }

    <!-- Desktop Utility Actions (Search, Cart, Profile) -->
    <app-navbar-actions />
  </div>
</header>
