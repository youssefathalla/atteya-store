@switch (menuState()) {
  @case ('pending') {
    <button matIconButton type="button" disabled aria-label="Account" aria-busy="true">
      <mat-icon name="person_outline" size="2xl" />
    </button>
  }
  @case ('signed-in') {
    <button
      matIconButton
      type="button"
      [matTooltip]="tooltip()"
      [matTooltipDisabled]="!tooltip()"
      aria-label="Your account"
      aria-haspopup="dialog"
      (click)="openPanel($event)"
    >
      <mat-icon name="person_outline" size="2xl" />
    </button>
  }
  @case ('signed-out') {
    <button
      matIconButton
      type="button"
      [matMenuTriggerFor]="menu"
      [matTooltip]="tooltip()"
      [matTooltipDisabled]="!tooltip()"
      aria-label="Sign in"
    >
      <mat-icon name="login" size="2xl" />
    </button>

    <mat-menu #menu="matMenu" [yPosition]="yPosition()" xPosition="before">
      <a mat-menu-item routerLink="/login" [queryParams]="signInParams()">
        <mat-icon name="login" />
        <span>Sign In</span>
      </a>
    </mat-menu>
  }
}
