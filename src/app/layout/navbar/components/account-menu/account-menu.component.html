@switch (menuState()) {
  @case ('pending') {
    <button matIconButton type="button" disabled aria-label="Account" aria-busy="true">
      <span class="invisible"><mat-icon name="login" size="2xl" /></span>
    </button>
  }
  @case ('signed-in') {
    <button
      matIconButton
      type="button"
      [matTooltip]="tooltip()"
      [matTooltipDisabled]="!tooltip()"
      aria-label="Your account"
      aria-haspopup="dialog"
      (click)="openPanel($event)"
    >
      <mat-icon name="person_outline" size="2xl" />
    </button>
  }
  @case ('signed-out') {
    <a
      matIconButton
      routerLink="/login"
      [queryParams]="signInParams()"
      [matTooltip]="tooltip() ? 'Sign in' : ''"
      [matTooltipDisabled]="!tooltip()"
      aria-label="Sign in"
    >
      <mat-icon name="login" size="2xl" />
    </a>
  }
}
