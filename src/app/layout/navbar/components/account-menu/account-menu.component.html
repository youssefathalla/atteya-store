@switch (menuState()) {
  @case ('pending') {
    <button matIconButton type="button" disabled aria-label="Account" aria-busy="true">
      <mat-icon name="person_outline" />
    </button>
  }
  @case ('signed-in') {
    <button
      matIconButton
      type="button"
      [matMenuTriggerFor]="menu"
      [matTooltip]="tooltip()"
      [matTooltipDisabled]="!tooltip()"
      aria-label="Account"
    >
      <mat-icon name="person_outline" size="2xl" />
    </button>

    <mat-menu #menu="matMenu" [yPosition]="yPosition()" xPosition="before">
      <button mat-menu-item type="button" disabled>
        <mat-icon name="person" />
        <span>{{ accountLabel() }}</span>
      </button>
      @if (isAdmin()) {
        <a mat-menu-item routerLink="/admin">
          <mat-icon name="dashboard" />
          <span>Admin dashboard</span>
        </a>
      }
      <button mat-menu-item type="button" (click)="signOut()">
        <mat-icon name="logout" />
        <span>Sign out</span>
      </button>
    </mat-menu>
  }
  @case ('signed-out') {
    <button
      matIconButton
      type="button"
      [matMenuTriggerFor]="menu"
      [matTooltip]="tooltip()"
      [matTooltipDisabled]="!tooltip()"
      aria-label="Account"
    >
      <mat-icon name="person_outline" size="2xl" />
    </button>

    <mat-menu #menu="matMenu" [yPosition]="yPosition()" xPosition="before">
      <a mat-menu-item routerLink="/login" [queryParams]="signInParams()">
        <mat-icon name="login" />
        <span>Sign in</span>
      </a>
    </mat-menu>
  }
}
