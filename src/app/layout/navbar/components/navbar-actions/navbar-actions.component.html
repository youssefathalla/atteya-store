<div class="flex items-center gap-1.5 sm:gap-2.5 icon-btn-lg">
  <!-- Quick search: opens the side panel (SearchPanelService) -->
  <button
    matIconButton
    matTooltip="Search"
    type="button"
    (click)="openSearch($event)"
    aria-label="Search products"
    aria-haspopup="dialog"
  >
    <mat-icon name="search" size="2xl" />
  </button>

  <!-- Cart with Badge -->
  <button
    matIconButton
    matTooltip="Cart"
    type="button"
    aria-label="Shopping Cart"
    (click)="toggleCart()"
    [matBadge]="cartCount()"
    [matBadgeHidden]="cartCount() === 0"
    [matBadgeDescription]="cartCount() + ' items in cart'"
  >
    <mat-icon name="shopping_bag" size="2xl" />
  </button>

  <app-account-menu tooltip="Account" />
</div>
