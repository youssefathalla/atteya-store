<button
  matButton
  type="button"
  [matMenuTriggerFor]="currencyMenu"
  (menuOpened)="openMenu()"
  [attr.aria-label]="'Choose currency, ' + currency.selected()"
>
  {{ currency.selected() }}
</button>

<mat-menu #currencyMenu="matMenu" xPosition="before">
  @for (option of currency.options(); track option.code) {
    <button mat-menu-item type="button" (click)="choose(option.code)">
      {{ option.label }}
    </button>
  }
</mat-menu>
