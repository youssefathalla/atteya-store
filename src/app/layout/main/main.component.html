<mat-drawer-container hasBackdrop="true" class="min-h-screen bg-surface">
  <!-- 1. END DRAWER: Slide-Over Cart (Desktop Only) -->
  <mat-drawer
    position="end"
    mode="over"
    [opened]="isDesktop() && drawerService.activeDrawer() === 'cart'"
    (closed)="drawerService.close()"
  >
    <!-- The server has no saved bag, so its HTML is always the empty bag. The browser fills the bag
         before hydration, so skip hydration here: the server copy is replaced, not reused. -->
    <app-cart-drawer placement="side" ngSkipHydration />
  </mat-drawer>

  <!-- 2. MAIN PAGE CONTENT -->
  <mat-drawer-content class="min-h-screen flex flex-col bg-surface">
    @if (navigating()) {
      <div
        class="fixed inset-x-0 top-0 z-50 h-0.5 bg-primary animate-pulse"
        role="status"
        aria-label="Loading page"
      ></div>
    }
    @if (showInitialShellLoader()) {
      <div class="fixed inset-0 z-40 bg-surface/90 elements-center" role="status" aria-label="Loading store">
        <app-loader [sectionSpace]="false" minHeight="40" [showMessage]="false" bg="surface" />
      </div>
    }
    @if (focusChrome()) {
      <!-- Single-task pages (Sign in, Checkout): logo only, links home. Same h-14 as the nav. -->
      <header class="h-14 w-full border-b border-outline-variant bg-surface elements-center">
        <app-logo />
      </header>
    } @else if (chromeReady()) {
      <!-- No wrappers around desktop-nav — a short parent becomes the sticky containing block. -->
      <app-announcement-bar #bannerChrome />
      <app-desktop-nav #navChrome />
    }

    <!-- Main Storefront Page View (bottom padding clears the mobile bottom bar) -->
    <main class="flex-1 w-full @container" [class]="focusChrome() ? '' : 'pb-20 lg:pb-0'">
      @if (pageLoadError.failedUrl(); as failedUrl) {
        <app-error-page class="container-content" kind="failed" [retryUrl]="failedUrl" />
      } @else if (pageLoadError.failedUrl() === '') {
        <app-error-page class="container-content" kind="failed" />
      }
      <!-- Kept (only hidden) while a page failed to download, so the open page comes back on the next link. -->
      <div class="w-full" [hidden]="pageLoadError.failedUrl() !== null">
        <router-outlet />
      </div>
    </main>

    @if (!focusChrome()) {
      <!-- Below the fold: rendered on the server, hydrated when it scrolls into view. -->
      @defer (hydrate on viewport) {
        <app-footer />
      }

      <!-- Persistent Mobile Navigation (Bottom bar + slide-up menu + slide-up cart) -->
      @if (chromeReady()) {
        <app-mobile-nav />
      }
    }
  </mat-drawer-content>
</mat-drawer-container>
