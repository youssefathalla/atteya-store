<mat-drawer-container hasBackdrop="true" class="min-h-screen bg-surface">
  <!-- 1. END DRAWER: Slide-Over Cart (Desktop Only) -->
  <mat-drawer
    position="end"
    mode="over"
    [opened]="isDesktop() && drawerService.activeDrawer() === 'cart'"
    (closed)="drawerService.close()"
  >
    <app-cart-drawer />
  </mat-drawer>

  <!-- 2. MAIN PAGE CONTENT -->
  <mat-drawer-content class="min-h-screen flex flex-col bg-surface">
    @if (navigating()) {
      <div
        class="fixed inset-x-0 top-0 z-50 h-0.5 bg-primary animate-pulse"
        role="status"
        aria-label="Loading page"
      ></div>
    }
    @if (showInitialShellLoader()) {
      <div
        class="fixed inset-0 z-40 bg-surface/90 elements-center"
        role="status"
        aria-label="Loading store"
      >
        <app-loader [sectionSpace]="false" minHeight="40" [showMessage]="false" bg="surface" />
      </div>
    }
    @if (chromeReady()) {
      <app-shipping-banner />
      <!-- Store Desktop Navigation Header -->
      <app-desktop-nav />
    }

    <!-- Main Storefront Page View -->
    <main class="flex-1 w-full pb-20 lg:pb-0 @container">
      <router-outlet />
    </main>

    <!-- Store Minimal Footer -->
    <footer
      class="w-full bg-surface-container-lowest border-t border-outline-variant py-10 pb-24 lg:pb-10 px-4 sm:px-6 lg:px-8 mt-auto select-none"
    >
      <div class="max-w-7xl mx-auto elements-between flex-col sm:flex-row gap-6">
        <div class="flex items-center gap-2">
          <span class="font-display-sm font-bold! tracking-widest uppercase"> ATTEYA. </span>
          <span class="font-label-sm font-mono opacity-80"> | Premier Padel & Sports Store </span>
        </div>

        <div class="flex items-center gap-6 font-label-md font-bold! tracking-wider uppercase opacity-80">
          <span>Official Dealer</span>
          <span>100% Authentic</span>
          <span>Express Shipping</span>
        </div>

        <div class="flex items-center gap-3 font-label-sm opacity-80">
          <p>&copy; 2026 Atteya Store. All rights reserved.</p>
          <span>&bull;</span>
          <a
            routerLink="/login"
            [queryParams]="{ returnUrl: '/admin' }"
            rel="nofollow"
            class="transition-colors underline-offset-4 hover:underline"
          >
            Admin Portal
          </a>
        </div>
      </div>
    </footer>

    <!-- Persistent Mobile Navigation (Bottom bar + slide-up menu + slide-up cart) -->
    @if (chromeReady()) {
      <app-mobile-nav />
    }
  </mat-drawer-content>
</mat-drawer-container>
