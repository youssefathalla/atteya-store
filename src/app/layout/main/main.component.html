<mat-drawer-container hasBackdrop="true" class="min-h-screen bg-surface text-on-surface">
  <!-- 1. END DRAWER: Slide-Over Cart (Desktop Only) -->
  <mat-drawer
    position="end"
    mode="over"
    [opened]="isDesktop() && drawerService.activeDrawer() === 'cart'"
    (closed)="drawerService.close()"
    class="w-full sm:max-w-md bg-surface border-s border-outline-variant shadow-mat-3 hidden lg:block"
  >
    <app-cart-drawer />
  </mat-drawer>

  <!-- 2. MAIN PAGE CONTENT -->
  <mat-drawer-content class="min-h-screen flex flex-col bg-surface text-on-surface">
    <!-- Store Desktop Navigation Header -->
    <app-desktop-nav />

    <!-- Main Storefront Page View -->
    <main class="flex-1 w-full pb-20 lg:pb-0">
      <router-outlet />
    </main>

    <!-- Store Minimal Footer -->
    <footer
      class="w-full bg-surface-container-lowest text-on-surface-variant border-t border-outline-variant py-10 pb-24 lg:pb-10 px-4 sm:px-6 lg:px-8 mt-auto select-none"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6"
      >
        <div class="flex items-center gap-2">
          <span
            class="font-display-sm text-lg font-black tracking-widest text-on-surface uppercase"
          >
            ATTEYA.
          </span>
          <span class="font-label-sm text-on-surface-variant font-mono">
            | Premier Padel & Sports Store
          </span>
        </div>

        <div
          class="flex items-center gap-6 font-label-md font-semibold tracking-wider uppercase text-on-surface-variant"
        >
          <span>Official Dealer</span>
          <span>100% Authentic</span>
          <span>Express Shipping</span>
        </div>

        <p class="font-label-sm text-on-surface-variant">
          &copy; 2026 Atteya Store. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- Persistent Mobile Navigation (Bottom bar + slide-up menu + slide-up cart) -->
    <app-mobile-nav />
  </mat-drawer-content>
</mat-drawer-container>
