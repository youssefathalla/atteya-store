<section class="surface-card p-5 sm:p-6 space-y-4" aria-label="Live Storefront Preview">
  <div class="elements-between flex-wrap gap-4 border-b border-outline-variant pb-4">
    <div>
      <div class="elements-start gap-2.5">
        <h3 class="font-title-md font-bold!">Live Storefront Preview</h3>
        <span
          class="px-2.5 py-0.5 border-shape bg-surface-container-high font-label-sm font-bold! opacity-80"
        >
          Section 1 •
          {{ hero().layoutCount === 1 ? 'Single Full Width' : hero().layoutCount + ' Side-by-Side' }}
        </span>
      </div>
      <p class="font-body-sm opacity-70 pt-0.5">
        Full-width real storefront preview. Switch between 1, 2, or 3 banners to see how your homepage looks
        live.
      </p>
    </div>

    <!-- Layout Mode Switcher (1 / 2 / 3) -->
    <div
      class="sm:elements-start flex-wrap gap-2 elements-start-col max-sm:w-full max-sm:[&>button]:w-full"
      role="group"
      aria-label="Select banner layout mode"
    >
      @for (opt of layoutOptions; track opt.count) {
        <button
          [matButton]="hero().layoutCount === opt.count ? 'filled' : 'tonal'"
          type="button"
          [attr.aria-pressed]="hero().layoutCount === opt.count"
          (click)="layoutCountChange.emit(opt.count)"
        >
          <mat-icon [name]="opt.icon" />
          <span>{{ opt.label }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Real Full-Width Storefront Hero Section -->
  <div
    class="w-full overflow-hidden border border-outline-variant border-shape bg-surface-container-lowest @container"
  >
    <app-hero-section
      [hero]="hero()"
      [isLoading]="isLoading()"
      [previewMode]="true"
      [activeSlotIndex]="activeSlotIndex()"
      (slotSelect)="activeSlotChange.emit($event)"
    />
  </div>
</section>
