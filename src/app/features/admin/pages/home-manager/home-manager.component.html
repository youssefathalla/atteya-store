<app-home-manager-header
  [isSaving]="isSaving()"
  [isResetting]="isResetting()"
  [isDirty]="draft.isDirty()"
  (resetDefaults)="resetToDefaults()"
  (discard)="discardDraft()"
  (publish)="publishChanges()"
/>

<div class="space-y-6 pt-6">
  <!-- Section Switcher Tabs (Section 1: Hero Banner | Section 2: Shop Categories) -->
  <div
    class="surface-card p-3 sm:elements-start elements-start-col gap-2 max-sm:[&>button]:w-full"
    role="tablist"
    aria-label="Select homepage section to manage"
  >
    <button
      [matButton]="draft.activeSection() === 'hero' ? 'filled' : 'tonal'"
      type="button"
      role="tab"
      [attr.aria-selected]="draft.activeSection() === 'hero'"
      (click)="draft.setActiveSection('hero')"
    >
      <mat-icon name="view_carousel" />
      <span>Section 1: Hero Banner</span>
    </button>

    <button
      [matButton]="draft.activeSection() === 'categories' ? 'filled' : 'tonal'"
      type="button"
      role="tab"
      [attr.aria-selected]="draft.activeSection() === 'categories'"
      (click)="draft.setActiveSection('categories')"
    >
      <mat-icon name="grid_view" />
      <span>Section 2: Shop Categories</span>
    </button>

    <button
      [matButton]="draft.activeSection() === 'navList' ? 'filled' : 'tonal'"
      type="button"
      role="tab"
      [attr.aria-selected]="draft.activeSection() === 'navList'"
      (click)="draft.setActiveSection('navList')"
    >
      <mat-icon name="format_list_bulleted" />
      <span>Section 3: Category list</span>
    </button>
  </div>

  @switch (draft.activeSection()) {
    @case ('hero') {
    <!-- Section 1: Hero Banner Preview & Editor -->
    <app-home-hero-preview
      [hero]="draft.draftHero()"
      [isLoading]="isLoading()"
      [activeSlotIndex]="draft.activeSlotIndex()"
      (layoutCountChange)="draft.setLayoutCount($event)"
      (activeSlotChange)="draft.setActiveSlot($event)"
    />

    <app-home-hero-editor
      [layoutCount]="draft.layoutCount()"
      [activeSlotIndex]="draft.activeSlotIndex()"
      [slide]="draft.activeSlide()"
      (activeSlotChange)="draft.setActiveSlot($event)"
      (headlineChange)="draft.updateHeadline($event)"
      (subtitleChange)="draft.updateSubtitle($event)"
      (imageUrlChange)="draft.updateImageUrl($event)"
      (imageAltChange)="draft.updateImageAlt($event)"
      (sessionUpload)="draft.registerSessionUpload($event)"
      (actionAdd)="openAddActionDialog()"
      (actionEdit)="openEditActionDialog($event.index, $event.action)"
      (actionDelete)="confirmDeleteAction($event)"
      (actionMove)="draft.moveAction($event.index, $event.direction)"
    />
    }
    @case ('categories') {
    <!-- Section 2: Shop Categories Preview & Editor -->
    <app-home-categories-preview
      [shopCategories]="draft.draftShopCategories()"
      [isLoading]="isLoading()"
      [activeCardIndex]="draft.activeShopCardIndex()"
      (activeCardChange)="draft.setActiveShopCard($event)"
    />

    <app-home-categories-editor
      [sectionTitle]="draft.shopTitle()"
      [cards]="draft.shopCards()"
      [activeCardIndex]="draft.activeShopCardIndex()"
      [activeCard]="draft.activeShopCard()"
      (activeCardChange)="draft.setActiveShopCard($event)"
      (titleChange)="draft.updateShopTitle($event)"
      (imageUrlChange)="draft.updateShopCardImageUrl($event)"
      (imageAltChange)="draft.updateShopCardImageAlt($event)"
      (buttonLabelChange)="draft.updateShopCardButtonLabel($event)"
      (buttonLinkChange)="draft.updateShopCardButtonLink($event)"
      (sessionUpload)="draft.registerSessionUpload($event)"
    />
    }
    @case ('navList') {
    <app-home-nav-list-preview
      [navList]="draft.draftNavList()"
      [isLoading]="isLoading()"
      [activeItemIndex]="draft.activeNavIndex()"
      (activeItemChange)="draft.setActiveNavItem($event)"
    />

    <app-home-nav-list-editor
      [sectionTitle]="draft.navTitle()"
      [items]="draft.navItems()"
      [activeItemIndex]="draft.activeNavIndex()"
      [activeItem]="draft.activeNavItem()"
      [isFull]="draft.navListIsFull()"
      (activeItemChange)="draft.setActiveNavItem($event)"
      (titleChange)="draft.updateNavTitle($event)"
      (labelChange)="draft.updateNavLabel($event)"
      (linkChange)="draft.updateNavLink($event)"
      (imageUrlChange)="draft.updateNavImageUrl($event)"
      (imageAltChange)="draft.updateNavImageAlt($event)"
      (sessionUpload)="draft.registerSessionUpload($event)"
      (itemAdd)="draft.addNavItem()"
      (itemRemove)="confirmRemoveNavItem($event)"
      (itemMove)="draft.moveNavItem($event.index, $event.direction)"
      (itemDrop)="draft.dropNavItem($event)"
      (importMenu)="importNavFromMenu()"
    />
    }
  }
</div>
