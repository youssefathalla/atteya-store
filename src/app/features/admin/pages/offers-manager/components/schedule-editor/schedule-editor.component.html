<div class="grid grid-cols-1 @3xl:grid-cols-2 gap-6 w-full">
  <fieldset class="elements-start-col items-stretch! justify-start! gap-2 min-w-0">
    <legend class="font-title-sm font-bold! mb-1">Starts</legend>
    <mat-radio-group
      class="elements-start-col justify-start! gap-1"
      aria-label="Starts"
      [value]="schedule().startsAt ? 'date' : 'now'"
      (change)="onStartMode($event.value)"
    >
      <mat-radio-button value="now">Right away</mat-radio-button>
      <mat-radio-button value="date">On a date</mat-radio-button>
    </mat-radio-group>
    @if (start(); as s) {
      <div class="grid grid-cols-[1fr_7rem] gap-2 w-full ps-0 @3xl:ps-10">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Start date</mat-label>
          <input
            matInput
            [matDatepicker]="startPicker"
            [value]="s.day"
            (dateChange)="onDay('start', $event.value)"
          />
          <mat-datepicker-toggle matIconSuffix [for]="startPicker" />
          <mat-datepicker #startPicker />
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Time</mat-label>
          <input matInput type="time" step="60" [value]="s.time" (change)="onTime('start', $event)" />
        </mat-form-field>
      </div>
    }
  </fieldset>

  <fieldset class="elements-start-col items-stretch! justify-start! gap-2 min-w-0">
    <legend class="font-title-sm font-bold! mb-1">Ends</legend>
    <mat-radio-group
      class="elements-start-col justify-start! gap-1"
      aria-label="Ends"
      [value]="schedule().endsAt ? 'date' : 'off'"
      (change)="onEndMode($event.value)"
    >
      <mat-radio-button value="off">When I turn it off</mat-radio-button>
      <mat-radio-button value="date">On a date</mat-radio-button>
    </mat-radio-group>
    @if (end(); as e) {
      <div class="grid grid-cols-[1fr_7rem] gap-2 w-full ps-0 @3xl:ps-10">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>End date</mat-label>
          <input
            matInput
            [matDatepicker]="endPicker"
            [min]="start()?.day ?? null"
            [value]="e.day"
            (dateChange)="onDay('end', $event.value)"
          />
          <mat-datepicker-toggle matIconSuffix [for]="endPicker" />
          <mat-datepicker #endPicker />
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Time</mat-label>
          <input matInput type="time" step="60" [value]="e.time" (change)="onTime('end', $event)" />
        </mat-form-field>
      </div>
      <div class="ps-0 @3xl:ps-10">
        <div class="elements-start flex-wrap gap-2" role="group" aria-label="Quick end date">
          @for (quick of quickEnds; track quick.id) {
            <button matButton="outlined" type="button" (click)="onQuickEnd(quick.id)">
              <span>{{ quick.label }}</span>
            </button>
          }
        </div>
      </div>
    }
  </fieldset>
</div>
