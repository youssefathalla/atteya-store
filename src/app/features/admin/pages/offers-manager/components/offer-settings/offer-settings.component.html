<div class="grid grid-cols-1 @3xl:grid-cols-2 gap-3 w-full">
  <mat-form-field class="w-full" appearance="outline">
    <mat-label>Products already on sale</mat-label>
    <mat-select [value]="draft().saleItems" (selectionChange)="onSaleItemsChange($event.value)">
      <mat-option value="bestOf">Best discount wins (recommended)</mat-option>
      <mat-option value="exclude">Skip products already on sale</mat-option>
    </mat-select>
    <mat-hint>{{ saleItemsExplanation() }}</mat-hint>
  </mat-form-field>

  <mat-form-field class="w-full" appearance="outline">
    <mat-label>Badge override (optional)</mat-label>
    <input
      matInput
      type="text"
      maxlength="24"
      placeholder="Leave empty for the automatic badge"
      [value]="draft().badge ?? ''"
      (input)="onBadgeChange($event)"
    />
    <mat-hint>Up to 24 characters, shown on product cards.</mat-hint>
  </mat-form-field>

  <mat-form-field class="w-full @3xl:w-56" appearance="outline">
    <mat-label>Priority</mat-label>
    <input
      matInput
      type="number"
      min="-100"
      max="100"
      [value]="draft().priority"
      (input)="onPriorityChange($event)"
    />
    <mat-hint>-100 to 100. Higher wins ties.</mat-hint>
  </mat-form-field>
</div>
