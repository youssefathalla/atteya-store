<form (ngSubmit)="submit()" autocomplete="off">
  <div class="px-6 pt-6 pb-2">
    <h2 mat-dialog-title class="font-title-lg font-bold! p-0!">Add New Category</h2>
    <p class="font-body-sm opacity-70 pt-1">
      Create a top-level category item for the store navigation header.
    </p>
  </div>

  <mat-dialog-content class="space-y-4 py-2!">
    <!-- Category Label -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Category Name</mat-label>
      <input
        matInput
        id="new-cat-label"
        name="new-cat-label"
        autocomplete="off"
        aria-label="Category Name"
        [ngModel]="label()"
        (ngModelChange)="onLabelChange($event)"
        placeholder="e.g. Rackets"
        required
        cdkFocusInitial
      />
      <mat-hint>Visible navigation text</mat-hint>
    </mat-form-field>

    <!-- Route Path -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Route / URL Path</mat-label>
      <input
        matInput
        id="new-cat-path"
        name="new-cat-path"
        autocomplete="off"
        aria-label="Route / URL Path"
        [ngModel]="path()"
        (ngModelChange)="onPathChange($event)"
        placeholder="/category/rackets"
        required
      />
      <button
        matIconButton
        matSuffix
        type="button"
        (click)="generateSlug()"
        matTooltip="Auto-generate path from name"
        aria-label="Auto-generate path"
      >
        <mat-icon name="auto_fix_high" />
      </button>
      <mat-hint>Destination link path</mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="gap-2 px-6 pb-4 pt-2">
    <button matButton="text" type="button" (click)="cancel()">
      Cancel
    </button>
    <button
      matButton="filled"
      type="submit"
      [disabled]="!isValid()"
    >
      <span>Create Category</span>
    </button>
  </mat-dialog-actions>
</form>
