<div class="surface-card p-6 space-y-4">
  <div class="sm:elements-between elements-start-col border-b border-outline-variant pb-3">
    <h3 class="font-title-md font-bold!">Category Details</h3>
    <span class="font-label-sm font-mono opacity-70"> ID: {{ category().id }} </span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- Display Label -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Display Label</mat-label>
      <input
        matInput
        id="cat-display-label"
        name="cat-display-label"
        autocomplete="off"
        aria-label="Display Label"
        [ngModel]="category().label"
        (ngModelChange)="labelChange.emit($event)"
        placeholder="e.g. Rackets"
      />
    </mat-form-field>

    <app-nav-target-field
      [fieldId]="'cat-' + category().id"
      [target]="category().target"
      [path]="category().path"
      [allowMenuOnly]="true"
      [allowOutside]="false"
      (targetChange)="targetChange.emit($event)"
    />
  </div>
</div>
