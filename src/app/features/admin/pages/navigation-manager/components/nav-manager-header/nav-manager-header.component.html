<!-- Top Header & Primary Sync Actions -->
<div class="surface-card xl:elements-between elements-start-col gap-4 p-5">
  <div>
    <h2 class="font-title-lg font-bold!">Store Navigation Hierarchy</h2>
    <p class="font-body-sm opacity-80">
      Configure categories, mega menu link groups, and featured release cards in real-time.
    </p>
  </div>

  <div class="elements-start-col sm:elements-between max-sm:w-full gap-2.5">
    <!-- Reset to Defaults Button -->
    <div class="w-full sm:w-50 [&>button]:w-full text-xl">
      <button
        matButton="tonal"
        type="button"
        theme="error"
        (click)="resetDefaults.emit()"
        [disabled]="isResetting() || isSaving()"
        [attr.aria-label]="isResetting() ? 'Resetting to defaults...' : null"
      >
        @if (isResetting()) {
          <mat-progress-spinner
            mode="indeterminate"
            diameter="18"
          />
        } @else {
          <mat-icon name="restart_alt" />
        }
        @if (!isResetting()) {
          <span>Reset to Defaults</span>
        }
      </button>
    </div>

    <!-- Discard Changes -->
    <div class="w-full sm:w-45 [&>button]:w-full">
      <button
        matButton="tonal"
        type="button"
        theme="warning"
        (click)="discard.emit()"
        [disabled]="isSaving()"
      >
        <span>Discard Changes</span>
      </button>
    </div>

    <!-- Publish Changes -->
    <div class="w-full sm:w-45 [&>button]:w-full">
      <button
        matButton="filled"
        type="button"
        (click)="publish.emit()"
        [disabled]="isSaving()"
        [attr.aria-label]="isSaving() ? 'Publishing to store...' : null"
      >
        @if (isSaving()) {
          <mat-progress-spinner
            mode="indeterminate"
            diameter="18"
          />
        } @else {
          <mat-icon name="check_circle" />
        }
        @if (!isSaving()) {
          <span>Publish to Store</span>
        }
      </button>
    </div>
  </div>
</div>
