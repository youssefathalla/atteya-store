<app-nav-manager-header
  [isSaving]="isSaving()"
  [isResetting]="isResetting()"
  (resetDefaults)="resetToDefaults()"
  (discard)="discardDraft()"
  (publish)="publishChanges()"
/>

<div class="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start pt-6">
  <!-- Left Panel: Category Tree List (4 cols on xl, 3 cols on 2xl) -->
  <div class="xl:col-span-4 2xl:col-span-3 xl:sticky xl:top-22 xl:z-10 panel-border">
    <app-nav-category-list
      [categories]="draft.draftCategories()"
      [selectedCategoryId]="draft.selectedCategoryId()"
      (categorySelect)="draft.selectCategory($event)"
      (categoryAdd)="openAddCategoryDialog()"
      (categoryDelete)="confirmDeleteCategory($event)"
      (categoryMove)="draft.moveCategory($event.index, $event.direction)"
      (categoryDrop)="draft.dropCategory($event)"
    />
  </div>

  <!-- Right Panel: Category & Mega Menu Detail Editor (8 cols on xl, 9 cols on 2xl) -->
  <div class="xl:col-span-8 2xl:col-span-9 space-y-6 panel-border">
    @if (draft.selectedCategory(); as category) {
      <app-nav-category-details
        [category]="category"
        (labelChange)="draft.updateCategoryBasic('label', $event)"
        (pathChange)="draft.updateCategoryPath($event)"
        (generatePath)="draft.generateCategoryPath()"
      />

      <app-nav-mega-menu-editor
        [columns]="category.megaMenu ?? []"
        (columnAdd)="openAddColumnDialog()"
        (columnDelete)="confirmDeleteColumn($event)"
        (columnTitleChange)="draft.updateColumnTitle($event.colIndex, $event.title)"
        (columnDrop)="draft.dropColumn($event)"
        (linkAdd)="openAddLinkDialog($event)"
        (linkDelete)="confirmDeleteLink($event.colIndex, $event.linkIndex)"
        (linkFieldChange)="
          draft.updateLinkField($event.colIndex, $event.linkIndex, $event.field, $event.value)
        "
        (linkDrop)="draft.dropLink($event.colIndex, $event.event)"
        (linkGenerateSlug)="draft.generateLinkSlug($event.colIndex, $event.linkIndex)"
      />
    } @else {
      <div class="surface-card p-12 text-center font-body-md opacity-70">
        Select a category from the left or click "Add" to start editing.
      </div>
    }
  </div>
</div>
