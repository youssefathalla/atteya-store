@if (settingsResource.isLoading()) {
  <app-skeleton class="h-40 w-full" />
} @else {
  <form class="surface-card p-5 space-y-4 max-w-xl" (submit)="$event.preventDefault(); save()">
    <p class="font-body-sm opacity-80">
      Shoppers outside Egypt see these details after they place a bank-transfer order. Use dev placeholders until production banking is ready.
    </p>

    <mat-form-field class="w-full" subscriptSizing="dynamic">
      <mat-label>Account name</mat-label>
      <input
        matInput
        [value]="draft().beneficiaryName"
        (input)="patch('beneficiaryName', $any($event.target).value)"
      />
    </mat-form-field>

    <mat-form-field class="w-full" subscriptSizing="dynamic">
      <mat-label>Bank name</mat-label>
      <input
        matInput
        [value]="draft().bankName"
        (input)="patch('bankName', $any($event.target).value)"
      />
    </mat-form-field>

    <mat-form-field class="w-full" subscriptSizing="dynamic">
      <mat-label>IBAN</mat-label>
      <input
        matInput
        [value]="draft().iban"
        (input)="patch('iban', $any($event.target).value)"
        autocomplete="off"
      />
    </mat-form-field>

    <mat-form-field class="w-full" subscriptSizing="dynamic">
      <mat-label>WhatsApp number (digits only)</mat-label>
      <input
        matInput
        [value]="draft().whatsAppNumber"
        (input)="patch('whatsAppNumber', $any($event.target).value)"
        inputmode="tel"
      />
    </mat-form-field>

    <mat-form-field class="w-full" subscriptSizing="dynamic">
      <mat-label>International shipping fee (EGP)</mat-label>
      <input
        matInput
        type="number"
        min="0"
        [value]="draft().internationalShippingFeeEgp"
        (input)="patch('internationalShippingFeeEgp', +$any($event.target).value)"
      />
    </mat-form-field>

    <div class="elements-end">
      <button matButton="filled" type="submit" [disabled]="isSaving()">
        @if (isSaving()) {
          <mat-progress-spinner mode="indeterminate" diameter="18" />
        } @else {
          Save
        }
      </button>
    </div>
  </form>
}
