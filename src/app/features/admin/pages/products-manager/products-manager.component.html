<div class="elements-start-col gap-6">
  <app-products-toolbar
    [(search)]="search"
    [(typeId)]="typeId"
    [(brandId)]="brandId"
    [brands]="brandOptions()"
    [categoryId]="categoryId()"
    (categoryIdChange)="setCategory($event)"
    [categories]="categoryOptions()"
    [(view)]="view"
    [counts]="counts()"
    [countsReady]="catalogResource.hasValue()"
    [activity]="activity()"
    (checkCatalog)="runMigration('add')"
    (removeLegacy)="runMigration('dropLegacy')"
    (rebuildSearch)="rebuildSearch()"
    (shippingWeights)="openShippingWeights()"
    (addProduct)="addProduct()"
  />
  @if (searchSyncErrors() > 0) {
    <p class="surface-card p-3 w-full font-body-sm">
      {{ searchSyncErrors() }} products didn't reach search. Run Rebuild search.
    </p>
  }
  @if (showSelectionBar()) {
    <section
      class="surface-card p-3 w-full grid gap-3 sm:grid-cols-[1fr_auto] sm:items-center"
      aria-label="Selected products"
    >
      <p class="font-body-md" aria-live="polite">
        @if (selectedIds().size > 0) {
          <span class="font-bold!">{{ selectedLabel() }}</span>
        } @else {
          <span class="text-on-surface-variant">Tick products to move them to another category.</span>
        }
      </p>
      <div class="grid gap-2 sm:grid-flow-col">
        <button
          matButton="outlined"
          type="button"
          [disabled]="selectAllDisabled()"
          (click)="selectAllShown()"
        >
          <span>Select All</span>
        </button>
        @if (selectedIds().size > 0) {
          <button matButton="outlined" type="button" (click)="clearSelection()">
            <span>Clear</span>
          </button>
          <button
            matButton="filled"
            type="button"
            [disabled]="activity() !== null"
            (click)="moveToCategory()"
          >
            <span>Move to Category</span>
          </button>
        }
      </div>
    </section>
  }
  <app-products-table
    [selectedIds]="selectedIds()"
    (toggleSelected)="toggleSelected($event)"
    [groups]="groups()"
    [loading]="showSkeleton()"
    [tableLoading]="tableLoading()"
    [loadError]="loadError()"
    [hasActiveFilters]="hasActiveFilters()"
    [catalogueEmpty]="catalogueEmpty()"
    (edit)="editProduct($event)"
    [switchingId]="switchingId()"
    (stock)="editStock($event)"
    (switchPublished)="switchPublished($event)"
  />
</div>
