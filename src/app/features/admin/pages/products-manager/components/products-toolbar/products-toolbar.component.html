<section class="surface-card p-5 w-full elements-start-col gap-5" aria-label="Product tools">
  <div class="products-toolbar__head w-full">
    <div class="elements-start-col gap-1">
      <h1 class="font-headline-sm font-bold!">Products</h1>
      <p class="font-body-md text-on-surface-variant">Each row is one product with all its colours.</p>
    </div>
    <div class="products-toolbar__actions">
      <button
        matButton="outlined"
        type="button"
        [disabled]="activity() !== null"
        [matMenuTriggerFor]="catalogToolsMenu"
        [attr.aria-label]="activity() === 'tools' ? 'Running catalogue tool' : null"
      >
        @if (activity() === 'tools') {
          <mat-progress-spinner mode="indeterminate" diameter="18" />
        } @else {
          <mat-icon name="build" />
        }
        @if (activity() !== 'tools') {
          <span>Catalogue Tools</span>
        }
      </button>
      <mat-menu #catalogToolsMenu="matMenu">
        <button mat-menu-item type="button" (click)="checkCatalog.emit()">
          <span>Check Catalogue Structure</span>
        </button>
        <button mat-menu-item type="button" (click)="removeLegacy.emit()">
          <span>Remove Old Fields</span>
        </button>
        <button mat-menu-item type="button" (click)="rebuildSearch.emit()">
          <span>Rebuild Search</span>
        </button>
        <button mat-menu-item type="button" (click)="shippingWeights.emit()">
          <span>Shipping Weights</span>
        </button>
      </mat-menu>
      <button matButton="filled" type="button" [disabled]="activity() !== null" (click)="addProduct.emit()">
        <mat-icon name="add" />
        <span>Add Product</span>
      </button>
    </div>
  </div>

  <div class="products-toolbar__filters w-full">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="products-toolbar__search w-full">
      <mat-label>Search</mat-label>
      <mat-icon matPrefix name="search" />
      <input
        matInput
        type="search"
        placeholder="Name, brand or model group"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Type</mat-label>
      <mat-select [value]="typeId()" (selectionChange)="typeId.set($event.value)">
        <mat-option value="all">All types</mat-option>
        @for (type of types; track type.id) {
          <mat-option [value]="type.id">{{ type.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Brand</mat-label>
      <mat-select [value]="brandId()" (selectionChange)="brandId.set($event.value)">
        <mat-option value="all">All brands</mat-option>
        @for (brand of brands; track brand.id) {
          <mat-option [value]="brand.id">{{ brand.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="products-toolbar__views" role="group" aria-label="Show products">
    @for (item of views; track item.id) {
      <button
        type="button"
        class="products-view-chip font-label-lg"
        [class.products-view-chip--active]="view() === item.id"
        [attr.aria-pressed]="view() === item.id"
        (click)="view.set(item.id)"
      >
        {{ item.label }}
        @if (countsReady()) {
          <span class="tabular-nums">{{ counts()[item.id] }}</span>
        }
      </button>
    }
  </div>
</section>
