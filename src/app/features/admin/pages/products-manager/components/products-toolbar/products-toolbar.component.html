<section class="surface-card p-5 w-full elements-start-col gap-4" aria-label="Product tools">
  <div class="elements-between flex-wrap gap-3 w-full">
    <div>
      <h1 class="font-title-lg font-bold!">Products</h1>
      <p class="font-body-md">Add and edit products here.</p>
    </div>
    <div class="elements-end flex-wrap gap-2">
      <button matButton="filled" type="button" [disabled]="activity() !== null" (click)="addProduct.emit()">
        <mat-icon name="add" />
        <span>Add Product</span>
      </button>
      <button
        matButton="outlined"
        type="button"
        [disabled]="activity() !== null"
        [matMenuTriggerFor]="catalogToolsMenu"
        [attr.aria-label]="activity() === 'tools' ? 'Running catalogue tool' : null"
      >
        @if (activity() === 'tools') {
          <mat-progress-spinner mode="indeterminate" diameter="18" />
        } @else {
          <mat-icon name="build" />
        }
        @if (activity() !== 'tools') {
          <span>Catalogue Tools</span>
        }
      </button>
      <mat-menu #catalogToolsMenu="matMenu">
        <button mat-menu-item type="button" (click)="checkCatalog.emit()">
          <span>Check Catalogue Structure</span>
        </button>
        <button mat-menu-item type="button" (click)="removeLegacy.emit()">
          <span>Remove Old Fields</span>
        </button>
        <button mat-menu-item type="button" (click)="rebuildSearch.emit()">
          <span>Rebuild Search</span>
        </button>
        <button mat-menu-item type="button" (click)="shippingWeights.emit()">
          <span>Shipping Weights</span>
        </button>
      </mat-menu>
    </div>
  </div>

  <div class="elements-end flex-wrap gap-3 w-full">
    <label class="elements-start-col gap-1 font-label-md w-full sm:max-w-xs">
      Search
      <input
        class="border-shape border border-outline bg-surface px-3 py-2 font-body-md"
        type="search"
        aria-label="Search products"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </label>
    <label class="elements-start-col gap-1 font-label-md">
      Type
      <select
        class="border-shape border border-outline bg-surface px-3 py-2 font-body-md"
        [value]="typeId()"
        (change)="onType($event)"
      >
        <option value="all">All types</option>
        @for (type of types; track type.id) {
          <option [value]="type.id">{{ type.label }}</option>
        }
      </select>
    </label>
    <label class="elements-start-col gap-1 font-label-md">
      Brand
      <select
        class="border-shape border border-outline bg-surface px-3 py-2 font-body-md"
        [value]="brandId()"
        (change)="onBrand($event)"
      >
        <option value="all">All brands</option>
        @for (brand of brands; track brand.id) {
          <option [value]="brand.id">{{ brand.label }}</option>
        }
      </select>
    </label>
  </div>
</section>
