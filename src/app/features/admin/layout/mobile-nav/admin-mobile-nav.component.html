<nav
  class="fixed bottom-0 inset-x-0 z-50 xl:hidden bg-surface border-t border-outline-variant px-4 py-1.5 pb-safe-bottom shadow-md select-none"
  aria-label="Admin mobile navigation"
>
  <div class="elements-between py-1 px-1 sm:px-2 icon-btn-lg">
    <!-- 1. Storefront Preview Link -->
    <a matIconButton routerLink="/" target="_blank" rel="noopener" aria-label="Preview Storefront">
      <mat-icon name="store" size="3xl" />
    </a>

    <!-- 2. Menu / Modules Toggle (menu <-> close) -->
    <button
      matIconButton
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle admin navigation menu"
    >
      <mat-icon [name]="isMenuOpen() ? 'close' : 'menu'" size="3xl" />
    </button>
  </div>
</nav>
