<nav
  class="fixed bottom-0 inset-x-0 z-50 xl:hidden bg-surface border-t border-outline-variant px-4 py-1.5 pb-safe-bottom shadow-md select-none"
  aria-label="Admin mobile navigation"
>
  <div class="elements-between py-1 px-1 sm:px-2 icon-btn-lg">
    <!-- 1. Storefront Preview Link -->
    <a matIconButton routerLink="/" target="_blank" rel="noopener" aria-label="Preview Storefront">
      <mat-icon name="store" />
    </a>

    <!-- 2. Quick access: Orders -->
    <a matIconButton routerLink="/admin/orders" aria-label="Orders">
      <mat-icon name="receipt_long" />
    </a>

    <!-- 3. Quick access: Add Product -->
    <a matIconButton routerLink="/admin/products/new" aria-label="Add Product">
      <mat-icon name="add" />
    </a>

    <!-- 4. Menu / Modules Toggle (menu <-> close) -->
    <button matIconButton type="button" (click)="toggleMenu()" aria-label="Toggle admin navigation menu">
      <mat-icon [name]="isMenuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</nav>
