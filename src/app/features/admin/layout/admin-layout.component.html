<div class="h-screen overflow-hidden flex flex-col">
  <!-- 1. FULL-HEIGHT SIDENAV CONTAINER -->
  <mat-sidenav-container class="flex-1 min-h-0 bg-surface-container-lowest" [hasBackdrop]="false">
    <!-- FULL-HEIGHT Angular Material Sidenav (Desktop lg+) -->
    <mat-sidenav
      mode="side"
      [opened]="isDesktop() && isDesktopSidebarOpen()"
      (openedChange)="onDesktopSidebarOpenedChange($event)"
    >
      <app-admin-sidebar [categories]="adminCategories()" />
    </mat-sidenav>

    <!-- 2. MAIN VIEWPORT & TOP NAVBAR -->
    <mat-sidenav-content class="min-h-full min-w-0 bg-surface-container-lowest">
      <app-admin-header
        [pageTitle]="currentPageTitle()"
        [isSidebarOpen]="isDesktopSidebarOpen()"
        (toggleSidebar)="toggleDesktopSidebar()"
      />

      <!-- Page Content Viewport (full flow inside sidenav-content) -->
      <main class="max-w-9xl mx-auto w-full px-4 sm:px-6 py-6 pb-24 xl:pb-6">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<!-- 3. MOBILE BOTTOM NAVIGATION (Visible only < lg) -->
<app-admin-mobile-nav />

<!-- 4. MOBILE SLIDE-UP DRILL-DOWN MENU -->
<app-admin-mobile-menu />
