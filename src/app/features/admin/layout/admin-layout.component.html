<div class="flex min-h-screen bg-surface-container-lowest" theme="info">
  <!-- 1. LEFT ADMIN SIDEBAR -->
  <aside
    class="w-64 border-r border-outline-variant bg-surface-container-lowest flex flex-col shrink-0 select-none"
  >
    <!-- Brand / Admin Header -->
    <div class="h-16 flex items-center gap-2.5 px-6 border-b border-outline-variant">
      <span
        class="font-display-sm font-bold! tracking-widest uppercase"
      >
        ATTEYA.
      </span>
      <span
        class="font-label-sm font-mono font-bold! px-1.5 py-0.5 rounded bg-surface-container-high uppercase tracking-wider opacity-80"
      >
        Admin
      </span>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 px-3 py-4 space-y-1" aria-label="Admin navigation">
      <a
        routerLink="/admin/navigation"
        routerLinkActive="bg-surface-container-high font-bold!"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg opacity-80 hover:opacity-100 hover:bg-surface-container transition-colors font-body-sm"
      >
        <mat-icon name="menu" size="sm" />
        <span>Navigation CMS</span>
      </a>

      <!-- Future Admin Features (Stubs) -->
      <div
        class="flex items-center justify-between px-3 py-2.5 rounded-lg opacity-40 font-body-sm cursor-not-allowed"
      >
        <div class="flex items-center gap-3">
          <mat-icon name="inventory_2" size="sm" />
          <span>Products</span>
        </div>
        <span class="font-label-sm font-mono text-[10px] uppercase">Soon</span>
      </div>

      <div
        class="flex items-center justify-between px-3 py-2.5 rounded-lg opacity-40 font-body-sm cursor-not-allowed"
      >
        <div class="flex items-center gap-3">
          <mat-icon name="shopping_cart" size="sm" />
          <span>Orders</span>
        </div>
        <span class="font-label-sm font-mono text-[10px] uppercase">Soon</span>
      </div>
    </nav>

    <!-- Admin Footer / Version info -->
    <div class="p-4 border-t border-outline-variant">
      <div class="flex items-center gap-3 px-2 py-2">
        <div
          class="size-8 rounded-full bg-surface-container-high elements-center font-label-sm font-bold!"
        >
          AD
        </div>
        <div class="min-w-0 flex-1">
          <div class="font-label-md font-bold! truncate">CMS Operator</div>
          <div class="font-label-sm font-mono opacity-60 truncate">
            v1.0.0-rc
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 2. MAIN VIEWPORT -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Topbar -->
    <header
      class="h-16 border-b border-outline-variant bg-surface-container-lowest flex items-center justify-between px-4 sm:px-8 select-none"
    >
      <div class="flex items-center gap-4">
        <h1 class="font-title-md font-bold! tracking-tight">
          Navigation Manager
        </h1>

        <!-- Live Sync Status Chip -->
        @if (navService.isLive()) {
          <div
            class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-outline-variant bg-surface-container-high font-label-sm font-bold!"
          >
            <span class="size-2 rounded-full bg-success animate-pulse"></span>
            <span>Firestore Live</span>
          </div>
        } @else {
          <div
            class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-outline-variant bg-surface-container-high font-label-sm font-bold!"
          >
            <span class="size-2 rounded-full bg-warning"></span>
            <span>Local Fallback</span>
          </div>
        }
      </div>

      <div class="flex items-center gap-3">
        <a matButton="outlined" routerLink="/" target="_blank" rel="noopener">
          <mat-icon name="open_in_new" size="sm" />
          <span>Preview Store</span>
        </a>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 max-w-9xl mx-auto px-4 py-6 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
