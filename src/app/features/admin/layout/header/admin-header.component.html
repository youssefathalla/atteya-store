<header class="h-16 border-b border-outline-variant elements-between px-4 sm:px-6 shrink-0 select-none">
  <!-- Left: Toggle Button (Desktop) + Page Title -->
  <div class="flex items-center gap-3 sm:gap-4 min-w-0">
    <!-- Desktop Sidenav Toggle Button: inside top navbar before title -->
    <div class="hidden xl:block shrink-0">
      <button
        matIconButton
        type="button"
        (click)="toggleSidebar.emit()"
        aria-label="Toggle navigation sidebar"
      >
        <mat-icon [name]="isSidebarOpen() ? 'menu_open' : 'menu'" />
      </button>
    </div>

    <!-- Dynamic Page Title -->
    <h1 class="font-title-lg font-semibold! tracking-tight truncate">
      {{ pageTitle() }}
    </h1>
  </div>

  <!-- Right Section: signed-in account, then the store link on a wide screen -->
  <div class="elements-center gap-2 sm:gap-3 shrink-0">
    @if (email()) {
      <span class="font-label-md hidden md:inline max-w-48 truncate">{{ email() }}</span>
    }
    <button matButton type="button" (click)="signOut()">
      <mat-icon name="logout" />
      <span>Sign Out</span>
    </button>
    <div class="hidden xl:block">
      <a matButton="filled" routerLink="/" target="_blank" rel="noopener">
        <mat-icon name="store" />
        <span>Go to Store</span>
      </a>
    </div>
  </div>
</header>
