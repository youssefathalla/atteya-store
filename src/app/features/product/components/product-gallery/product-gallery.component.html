@let photos = displayImages();
<div class="w-full elements-start-col gap-3">
  <section
    #track
    class="pdp-gallery-track"
    [class.pdp-gallery-track--single]="photos.length <= 1"
    tabindex="0"
    [attr.aria-label]="name() + ' photos'"
    (scroll)="onScroll()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerEnd($event)"
    (pointercancel)="onPointerEnd($event)"
    (dragstart)="$event.preventDefault()"
  >
    @for (img of photos; track img.path; let i = $index) {
      <div class="pdp-gallery-slide">
        @if (i === 0) {
          <img
            [ngSrc]="path(img.path)"
            [appImageFallback]="img.path"
            [alt]="imageAlt(img, i)"
            fill
            priority
            [sizes]="sizes"
            class="object-contain"
          />
        } @else {
          <img
            [ngSrc]="path(img.path)"
            [appImageFallback]="img.path"
            [alt]="imageAlt(img, i)"
            fill
            [sizes]="sizes"
            class="object-contain"
          />
        }
      </div>
    } @empty {
      <div class="pdp-gallery-slide elements-center">
        <mat-icon name="image" size="4xl" />
      </div>
    }
  </section>

  @if (photos.length > 1) {
    <div class="elements-center gap-4 w-full">
      <button
        matIconButton
        type="button"
        aria-label="Previous photo"
        [disabled]="active() === 0"
        (click)="step(-1)"
      >
        <mat-icon name="arrow_back" />
      </button>
      <p class="pdp-kicker min-w-12 text-center" aria-live="polite">
        <span aria-hidden="true">{{ counter() }}</span
        ><span class="sr-only">{{ counterSpoken() }}</span>
      </p>
      <button matIconButton type="button" aria-label="Next photo" [disabled]="atEnd()" (click)="step(1)">
        <mat-icon name="arrow_forward" />
      </button>
    </div>
  }
</div>
