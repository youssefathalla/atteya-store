@if (list().length > 0) {
  <div class="w-full elements-start-col gap-2">
    <p class="font-label-lg">{{ label() }}</p>
    <ul class="flex flex-wrap gap-2 list-none m-0 p-0">
      <li>
        <span class="pdp-colour-thumb" aria-current="true">
          <span class="sr-only">{{ currentName() }}, shown now</span>
          @if (currentImage(); as img) {
            <img
              [ngSrc]="imagePath(img.path)"
              [appImageFallback]="img.path"
              alt=""
              width="64"
              height="64"
              class="size-full object-contain"
            />
          }
        </span>
      </li>
      @for (s of list(); track s.id) {
        <li>
          <a
            class="pdp-colour-thumb"
            [routerLink]="['/product', s.slug]"
            [appPrefetchProduct]="s.slug"
            [attr.aria-label]="s.name"
          >
            @if (s.images[0]; as img) {
              <img
                [ngSrc]="imagePath(img.path)"
                [appImageFallback]="img.path"
                alt=""
                width="64"
                height="64"
                class="size-full object-contain"
              />
            }
          </a>
        </li>
      }
    </ul>
  </div>
}
