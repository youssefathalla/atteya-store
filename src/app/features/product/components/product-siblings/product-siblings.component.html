@if (items().length > 0) {
  <div class="w-full elements-start-col gap-2">
    <p class="font-label-lg">{{ label() }}</p>
    <ul class="flex flex-wrap gap-2 list-none m-0 p-0">
      @for (s of items(); track s.id) {
        <!-- Same element for every colour, so switching only moves the underline (no photo reload). -->
        <li>
          <a
            class="pdp-colour-thumb"
            [href]="'/product/' + s.slug"
            [appPrefetchProduct]="s.slug"
            [attr.aria-current]="s.current ? 'page' : null"
            [attr.aria-label]="s.current ? s.name + ', shown now' : s.name"
            (click)="open($event, s)"
          >
            @if (s.image; as img) {
              <img
                [ngSrc]="imagePath(img.path)"
                [appImageFallback]="img.path"
                alt=""
                width="64"
                height="64"
                class="size-full object-contain"
              />
            }
          </a>
        </li>
      }
    </ul>
  </div>
} @else if (group.isLoading()) {
  <!-- Keeps the space the defer placeholder reserved until the query settles. -->
  <div class="w-full min-h-23" aria-hidden="true"></div>
}
