@if (hasSiblings()) {
  <section aria-labelledby="pdp-other-colours" class="w-full elements-start-col gap-3">
    <h2 id="pdp-other-colours" class="font-title-md font-bold!">Other colours</h2>
    <div
      appHorizontalScroll
      [snapToItems]="false"
      class="flex gap-4 w-full overflow-x-auto pb-2"
    >
      @for (s of list(); track s.id) {
        <a
          [routerLink]="['/product', s.slug]"
          class="surface-card p-3 elements-start-col gap-3 border-shape no-underline shrink-0 w-44 sm:w-52"
        >
          <div class="relative aspect-square w-full overflow-hidden border-shape bg-surface-container">
            @if (s.images[0]; as img) {
              <img
                [ngSrc]="imagePath(img.path)"
                [appImageFallback]="img.path"
                [alt]="siblingAlt(s)"
                fill
                sizes="(max-width: 640px) 176px, 208px"
                class="object-cover"
              />
            }
          </div>

          <div class="w-full elements-start-col gap-1">
            <span class="font-label-sm uppercase tracking-wider text-on-surface-variant">
              {{ brandName(s.brandId) }}
            </span>
            <h3 class="font-title-sm font-bold! line-clamp-2" dir="auto">{{ s.name }}</h3>
            <app-product-price class="pt-1" [price]="s.price" [listPrice]="s.compareAtPrice" />
          </div>
        </a>
      }
    </div>
  </section>
}
