@if (showSection()) {
  <section
    class="container-content home-new-arrivals select-none"
    aria-labelledby="new-arrivals-heading"
  >
    <header class="pb-2 sm:pb-3">
      <h2 id="new-arrivals-heading" class="home-section-title">
        <a
          class="home-section-title-link"
          routerLink="/shop"
          [queryParams]="{ newArrivals: '1' }"
        >
          <span>New arrivals</span>
          <mat-icon name="arrow_forward" size="lg" />
        </a>
      </h2>
    </header>

    @if (isLoading()) {
      <div
        class="scroll-row [--scroll-peek:2.5rem] sm:[--scroll-cols:2] md:[--scroll-cols:3] md:[--scroll-peek:3.5rem]"
        aria-hidden="true"
      >
        @for (slot of skeletonSlots; track slot) {
          <div class="scroll-row-item elements-start-col gap-2">
            <app-skeleton class="aspect-4/5 w-full" />
            <app-skeleton class="h-4 w-1/3" />
            <app-skeleton class="h-5 w-3/4" />
            <app-skeleton class="h-4 w-2/3" />
            <app-skeleton class="h-5 w-1/3" />
          </div>
        }
      </div>
    } @else {
      <div
        #scrollRow
        class="scroll-row [--scroll-peek:2.5rem] sm:[--scroll-cols:2] md:[--scroll-cols:3] md:[--scroll-peek:3.5rem]"
        [style.--scroll-peek]="cards().length > 3 ? null : '0px'"
        appHorizontalScroll
        appRowScrollLock
        rowLockFit=".product-card__media"
        #lock="rowScrollLock"
        [enableWheel]="false"
        [snapToItems]="!lock.enabled()"
      >
        @for (card of cards(); track card.id) {
          <div class="scroll-row-item">
            <app-product-card
              [product]="card"
              sizes="(max-width: 639px) 70vw, (max-width: 1023px) 45vw, 28vw"
            />
          </div>
        }
      </div>

      @if (isBrowser && (canPrev() || canNext())) {
        <app-row-scroll-nav
          [progress]="progress()"
          [canPrev]="canPrev()"
          [canNext]="canNext()"
          (prev)="lock.step(-1)"
          (next)="lock.step(1)"
        />
      }
    }
  </section>
}
