<div class="w-full flex flex-col bg-surface">
  <app-hero-section [hero]="hero()" [isLoading]="isLoading()" />

  @defer (hydrate on viewport) {
    <app-shop-categories-section [shopCategories]="shopCategories()" [isLoading]="isLoading()" />
  } @placeholder {
    <section class="container-content" aria-hidden="true">
      <app-skeleton class="w-full min-h-120" />
    </section>
  }

  @defer (hydrate on viewport) {
    <app-navigation-list-section [navList]="navList()" [isLoading]="isLoading()" />
  } @placeholder {
    <section class="container-content" aria-hidden="true">
      <app-skeleton class="w-full min-h-120" />
    </section>
  }

  @defer (hydrate on viewport) {
    <app-padel-carousel-section />
  } @placeholder {
    <section class="container-content" aria-hidden="true">
      <app-skeleton class="w-full min-h-80" />
    </section>
  }

  @defer (hydrate on viewport) {
    <app-new-arrivals-section />
  } @placeholder {
    <section class="container-content" aria-hidden="true">
      <app-skeleton class="w-full min-h-120" />
    </section>
  }
</div>
