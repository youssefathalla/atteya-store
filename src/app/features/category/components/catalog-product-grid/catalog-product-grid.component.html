@if (loading()) {
  <div
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full"
    aria-label="Loading products"
  >
    @for (slot of skeletonSlots; track slot) {
      <div class="surface-card p-3 elements-start-col gap-3">
        <app-skeleton class="aspect-square w-full" />
        <app-skeleton class="h-4 w-1/3" />
        <app-skeleton class="h-5 w-3/4" />
        <app-skeleton class="h-5 w-1/2" />
      </div>
    }
  </div>
} @else {
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full">
    @for (product of products(); track product.id; let i = $index) {
      <a
        [routerLink]="['/product', product.slug]"
        [appPrefetchProduct]="product.slug"
        class="surface-card p-3 elements-start-col gap-3 border-shape no-underline"
      >
        <div class="relative aspect-square w-full overflow-hidden border-shape bg-surface-container">
          @if (product.images[0]; as image) {
            <img
              [ngSrc]="imagePath(image.path)"
              [appImageFallback]="image.path"
              [alt]="image.alt || product.name"
              fill
              [priority]="i < 2"
              sizes="(max-width: 767px) 50vw, (max-width: 1023px) 33vw, 25vw"
              class="object-cover"
            />
          }
        </div>

        <div class="w-full elements-start-col gap-1">
          <span class="font-label-sm uppercase tracking-wider text-on-surface-variant">
            {{ brandLabel(product.brandId) }}
          </span>
          <h2 class="font-title-sm font-bold! line-clamp-2">{{ product.name }}</h2>
          @if (priceFor(product.id); as pr) {
            <app-product-price
              class="pt-1"
              [price]="pr.price"
              [fromPrice]="pr.fromPrice"
              [partial]="pr.partial"
              [listPrice]="pr.listPrice"
              [badges]="pr.badges"
            />
          }
        </div>
      </a>
    }
  </div>
}
