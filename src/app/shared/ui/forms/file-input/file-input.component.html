<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <label [for]="inputId" class="font-body-sm font-bold!">
      {{ label() }}
    </label>
  }

  <input
    #fileInput
    type="file"
    [id]="inputId"
    class="hidden"
    [accept]="accept()"
    (change)="onFileChange($event)"
  />

  <div
    class="border border-dashed border-outline-variant hover:border-primary border-shape p-5 elements-center flex-col gap-2.5 bg-surface-container-low transition-colors"
    [class.border-error]="showError()"
  >
    @if (hasFile()) {
      <!-- PREVIEW STATE -->
      @if (isImage()) {
        <div
          class="relative size-24 border-shape overflow-hidden border border-outline-variant shadow-mat-1"
        >
          <img
            [ngSrc]="previewUrl() || ''"
            class="object-cover"
            [alt]="label() || 'File preview'"
            fill
          />
        </div>
      } @else {
        <div class="flex items-center gap-2">
          <mat-icon name="description" size="2xl" iconColor="primary" />
          <span class="font-body-sm truncate max-w-50">{{
            fileName() || 'File selected'
          }}</span>
        </div>
      }
      <button
        matButton="outlined"
        type="button"
        (click)="triggerUpload()"
      >
        <span class="flex items-center gap-2">
          <mat-icon name="edit" size="sm" />
          <span>Change File</span>
        </span>
      </button>
    } @else {
      <!-- EMPTY STATE: Centered normal button with label and max size -->
      <button
        matButton="outlined"
        type="button"
        (click)="triggerUpload()"
      >
        <span class="flex items-center gap-2">
          <mat-icon name="upload_file" size="lg" />
          <span>Choose File</span>
        </span>
      </button>
      <span class="font-label-sm opacity-70">
        Max size: {{ (maxSizeBytes() / (1024 * 1024)).toFixed(0) }}MB
      </span>
    }
  </div>

  <!-- Error Message -->
  @if (localError() || showError()) {
    <div class="flex items-center gap-1.5 px-1 animate-slide-down">
      <mat-icon name="error" size="sm" iconColor="error" />
      <span class="text-error font-body-sm">
        {{ errorMessage() }}
      </span>
    </div>
  }
</div>
