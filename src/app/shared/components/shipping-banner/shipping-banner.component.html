@if (text()) {
  <div
    class="w-full bg-surface-container-lowest border-b border-outline-variant px-4 py-2 elements-between gap-3"
    role="status"
  >
    <span class="font-label-md flex-1 text-center">{{ text() }}</span>
    <button matIconButton type="button" aria-label="Dismiss announcement" (click)="dismiss()">
      <mat-icon name="close" />
    </button>
  </div>
}
