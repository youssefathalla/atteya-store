<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atteya Store</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atteya" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        var r = document.documentElement;
        if (r.hasAttribute('data-currency-ready')) {
        } else {
          var c = '';
          try {
            c = (new URLSearchParams(location.search).get('cur') || '').toUpperCase();
          } catch (e) {}
          var country = r.getAttribute('data-visitor-country') || '';
          if (c === 'EGP' || country === 'EG') {
          } else if (c || country) {
            r.setAttribute('data-cur-pending', '');
          } else {
            r.setAttribute('data-cur-pending', '');
          }
        }
      } catch (e) {}
      // Signed in on this device (signed-in-hint.ts, ATS-287): footer.css hides the email sign-up.
      try {
        if (localStorage.getItem('atteya-signed-in') === '1') {
          document.documentElement.setAttribute('data-signed-in', '');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
