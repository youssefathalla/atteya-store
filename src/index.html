<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atteya Store</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" as="font" type="font/woff2" href="fonts/google-sans-flex-subset.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/material-symbols-outlined-subset.woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atteya" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
