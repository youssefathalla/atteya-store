# Production configuration for Firebase App Hosting (attiya-store)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 1 # Keeps at least 1 warm instance for production traffic
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
  - variable: APP_HOSTING_ENV
    value: prod
    availability:
      - BUILD
      - RUNTIME
