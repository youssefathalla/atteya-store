# Production configuration for Firebase App Hosting (attiya-store)
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0 # Scale to 0 while traffic is low; raise to 1 when ads/traffic start
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: APP_HOSTING_ENV
    value: prod
    availability:
      - BUILD
      - RUNTIME
  # Hosts the server-rendered site answers for (angular.json allowedHosts is empty). Keep the
  # hosted.app address so the site still works there; www and the bare name are the store's domain.
  - variable: NG_ALLOWED_HOSTS
    value: www.atteyastore.com,atteyastore.com,atteya-store--attiya-store.europe-west4.hosted.app
    availability:
      - RUNTIME
