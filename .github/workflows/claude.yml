name: Claude Mentions

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    name: Answer @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Acknowledge with eyes
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
          # Opus 5.5 ignores top-level effortLevel in user settings; set per-model
          # via modelSettings (code.claude.com/docs/en/model-config + settings-reference).
          # Prefer settings over --effort: CLAUDE_ARGS --effort was not reaching SDK options.
          settings: |
            {
              "modelSettings": {
                "claude-opus-5-5": {
                  "effortLevel": "high"
                }
              }
            }
          claude_args: |
            --model claude-opus-5-5
